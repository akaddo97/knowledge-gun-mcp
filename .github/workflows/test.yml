name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install package + dev deps
        run: uv pip install --system -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install package
        run: uv pip install --system -e .

      - name: Run pip-audit
        # --strict treats "dep not on PyPI" as a hard error; knowledge-gun (parent
        # library) is GitHub-only, so strict mode would fail every run for a
        # non-security reason. Default mode still audits all PyPI-listed deps for
        # CVEs and exits non-zero on any real vulnerability finding.
        run: |
          uv pip install --system pip-audit
          pip-audit
